<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <div class="display" aria-live="polite" aria-atomic="true">
      <div class="previous-operand" id="previous-operand"></div>
      <output class="current-operand" id="current-operand" aria-label="Display">0</output>
    </div>
    <div class="keys">
      <button class="key key--utility" data-action="clear">AC</button>
      <button class="key key--utility" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="key key--operator" data-operation="÷" aria-label="Divide">÷</button>
      <button class="key key--operator" data-operation="×" aria-label="Multiply">×</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key--operator" data-operation="−" aria-label="Subtract">−</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key--operator" data-operation="+" aria-label="Add">+</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key--equals" data-action="equals">=</button>

      <button class="key key--zero" data-number="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
    </div>
    <p class="hint">Keyboard supported · Esc to clear</p>
  </main>
</body>
</html>
